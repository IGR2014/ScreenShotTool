name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    env:
      # Set this secret to enable SignPath code signing; empty = unsigned release.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build x64
        run: |
          cmake -S . -B build64 -A x64 -DSST_BUILD_TESTS=OFF
          cmake --build build64 --config Release --parallel

      - name: Build Win32
        run: |
          cmake -S . -B build32 -A Win32 -DSST_BUILD_TESTS=OFF
          cmake --build build32 --config Release --parallel

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # 32-bit injector launches the 64-bit helper, so ship both hook DLLs,
          # the 32-bit GUI and the 64-bit patcher together.
          Copy-Item build32/Release/DLLInjector.exe dist/
          Copy-Item build32/Release/hookX86.dll     dist/
          Copy-Item build64/Release/hookX64.dll     dist/
          Copy-Item build64/Release/x64Patcher.exe  dist/
          Copy-Item README.md                       dist/

      # Upload the unsigned binaries so SignPath can pull them as a build artifact.
      - name: Upload unsigned artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: dist/

      # Sign via SignPath Foundation (runs only when the API token secret is set).
      # Configure the vars below + the secret in repo settings; see README.
      - name: Submit signing request to SignPath
        id: signpath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # Package the signed output when signing ran, otherwise the unsigned staging dir.
      - name: Package release zip
        id: package
        shell: pwsh
        run: |
          $dir = if ($env:SIGNPATH_API_TOKEN) { 'signed' } else { 'dist' }
          $zip = "ScreenShotTool-${{ steps.tag.outputs.tag }}.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" `
            "${{ steps.package.outputs.zip }}" `
            --title "ScreenShotTool ${{ steps.tag.outputs.tag }}" `
            --generate-notes
